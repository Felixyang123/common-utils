server:
  port: 8083

spring:
  application:
    name: thread-pool-sample-cs-client

thread:
  pool:
    enabled: true
    remote:
      enabled: true
      server-url: http://localhost:8080
      app-id: sample-app
      api-key: demo-api-key
      long-polling-timeout-ms: 30000
      pull-interval-ms: 0
      report-enabled: true
      report-interval-ms: 10000
    pools:
      - name: order-pool
        core-pool-size: 4
        maximum-pool-size: 8
        queue-capacity: 256
      - name: notification-pool
        core-pool-size: 2
        maximum-pool-size: 4
        queue-capacity: 64
