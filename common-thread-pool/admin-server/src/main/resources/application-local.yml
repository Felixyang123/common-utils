# local profile：H2 文件持久化 + 进程内 ConcurrentHashMap 缓存
# 单条命令即可启动，无任何外部进程依赖。
#
# 启动：mvn -pl common-thread-pool/admin-server spring-boot:run
#   或：java -jar admin-server.jar

spring:
  datasource:
    url: jdbc:h2:mem:threadpool_admin;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always                  # local 每次启动都执行 schema.sql（CREATE TABLE IF NOT EXISTS 是幂等的）
      schema-locations: classpath:schema.sql
  autoconfigure:
    exclude:
      # local 模式不连 Redis，禁用 Redisson 自动配置（使 RedissonCacheService 不装配，LocalCacheService 兜底）
      org.redisson.spring.starter.RedissonAutoConfigurationV2

threadpool:
  admin:
    rate-limit:
      enabled: false            # local 模式不连 Redis，关闭限流（依赖 RedissonClient）