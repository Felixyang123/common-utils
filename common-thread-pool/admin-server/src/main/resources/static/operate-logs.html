<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 - ThreadPool Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/drawer.css">
</head>
<body>

<script src="/js/common.js"></script>
<script>
  if (!requireAuth()) throw new Error('redirect');
</script>

<nav class="topbar" id="topbar"></nav>

<div class="page">

  <div class="breadcrumb">threadpool / 操作日志</div>
  <div class="page-header">
    <div>
      <h1>操作日志</h1>
      <p class="text-sm text-muted mt-2">记录所有管理员对线程池配置和 API Key 的操作</p>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">↧ 导出 CSV</button>
  </div>

  <!-- Filter Bar -->
  <div class="card mb-4" style="padding:0;">
    <div class="filter-bar">
      <div>
        <label>业务类型</label>
        <select class="form-control" id="f-biz" style="width:160px;" onchange="search()">
          <option value="">全部</option>
          <option value="APIKEY">APIKEY</option>
          <option value="THREADPOOL_CONFIG">THREADPOOL_CONFIG</option>
        </select>
      </div>
      <div>
        <label>操作类型</label>
        <select class="form-control" id="f-op" style="width:140px;" onchange="search()">
          <option value="">全部</option>
          <option value="CREATE">CREATE</option>
          <option value="UPDATE">UPDATE</option>
          <option value="DELETE">DELETE</option>
          <option value="REGENERATE">REGENERATE</option>
          <option value="ROLLBACK">ROLLBACK</option>
        </select>
      </div>
      <div>
        <label>操作人</label>
        <input class="form-control" id="f-user" placeholder="用户名" style="width:120px;">
      </div>
      <div>
        <label>业务ID</label>
        <input class="form-control" id="f-bizid" placeholder="appId / poolName" style="width:160px;">
      </div>
      <button class="btn btn-primary btn-sm" onclick="search()">查询</button>
      <button class="btn btn-ghost btn-sm" onclick="resetFilter()">重置</button>
    </div>
  </div>

  <!-- Log Table -->
  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:60px;">ID</th>
            <th style="width:160px;">时间</th>
            <th style="width:100px;">业务类型</th>
            <th style="width:100px;">操作类型</th>
            <th>业务ID</th>
            <th style="width:100px;">操作人</th>
            <th style="width:80px;">内容</th>
          </tr>
        </thead>
        <tbody id="log-list">
          <tr><td colspan="7" class="empty-state" style="padding:40px;">
            <div class="empty-state__desc">加载中...</div>
          </td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pager"></div>
  </div>

</div>

<!-- ═════════════════ CONTENT DRAWER ═════════════════ -->
<div class="drawer-overlay" id="content-overlay" onclick="closeContentDrawer()"></div>
<div class="drawer drawer--lg" id="content-drawer" style="--drawer-width: 580px;">
  <div class="drawer__header">
    <div class="drawer__title">操作详情 <span id="content-type" class="badge badge-blue"></span></div>
    <button class="drawer__close" onclick="closeContentDrawer()">&times;</button>
  </div>
  <div class="drawer__body">
    <div style="display:grid;grid-template-columns:90px 1fr;gap:12px 16px;font-size:13px;margin-bottom:24px;">
      <span class="text-muted">时间</span><span id="d-time" class="text-muted"></span>
      <span class="text-muted">操作人</span><span id="d-operator"></span>
      <span class="text-muted">业务ID</span><code id="d-bizid"></code>
    </div>
    <h3 style="font-size:13px;font-weight:600;margin-bottom:8px;">变更内容</h3>
    <pre id="content-json" style="background:var(--color-surface-2);padding:16px;border-radius:6px;max-height:480px;overflow:auto;font-size:12px;line-height:1.6;"></pre>
  </div>
  <div class="drawer__footer">
    <button class="btn btn-ghost btn-sm" onclick="copyContent()">复制 JSON</button>
    <button class="btn btn-primary" onclick="closeContentDrawer()">关闭</button>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
renderTopbar('operate-logs.html');

const params = new URLSearchParams(location.search);
document.getElementById('f-biz').value = params.get('bizType') || '';
document.getElementById('f-bizid').value = params.get('bizId') || '';

let page = 1, total = 0, currentRows = [];
const PAGE_SIZE = 20;

// ── Init ──
render();

// ── Bind filter inputs (Enter to search) ──
['f-user','f-bizid'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') search(); });
});

async function search() { page = 1; await render(); }

async function render() {
  const biz = document.getElementById('f-biz').value;
  const op = document.getElementById('f-op').value;
  const user = document.getElementById('f-user').value.trim();
  const bizId = document.getElementById('f-bizid').value.trim();
  let url = `/api/operate-logs/list?page=${page}&pageSize=${PAGE_SIZE}`;
  if (biz) url += `&bizType=${biz}`;
  if (op) url += `&operateType=${op}`;
  if (user) url += `&operator=${encodeURIComponent(user)}`;
  if (bizId) url += `&bizId=${encodeURIComponent(bizId)}`;

  const data = await apiGet(url);
  if (!data || data.code !== 0) return;
  const d = data.data || { total: 0, list: [] };
  total = d.total || 0;
  currentRows = d.list || [];

  const tbody = document.getElementById('log-list');
  if (!currentRows.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="padding:40px;">
      <div class="empty-state__title">暂无日志</div>
      <div class="empty-state__desc">当前过滤条件下没有匹配的操作记录</div>
    </td></tr>`;
    document.getElementById('pager').innerHTML = '';
    return;
  }

  tbody.innerHTML = currentRows.map(r => {
    const opBadge = badgeOpType(r.operateType);
    const bizBadge = badgeBizType(r.bizType);
    return `<tr>
      <td class="text-muted text-mono">#${r.id}</td>
      <td class="text-sm text-muted">${new Date(r.createTime).toLocaleString('zh-CN')}</td>
      <td>${bizBadge}</td>
      <td>${opBadge}</td>
      <td><code class="text-sm">${r.bizId || '-'}</code></td>
      <td>${r.operator || '<span class="text-muted">-</span>'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick='showContent(${JSON.stringify(r).replace(/'/g,"&#39;")})'>查看</button></td>
    </tr>`;
  }).join('');

  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  document.getElementById('pager').innerHTML = `
    <button class="btn btn-ghost btn-sm" ${page<=1?'disabled':''} onclick="goPage(${page-1})">← 上一页</button>
    <span>第 ${page} / ${totalPages} 页 · 共 ${total} 条</span>
    <button class="btn btn-ghost btn-sm" ${page>=totalPages?'disabled':''} onclick="goPage(${page+1})">下一页 →</button>`;
}

function goPage(p) { page = p; render(); }

function resetFilter() {
  ['f-biz','f-op','f-user','f-bizid'].forEach(id => document.getElementById(id).value = '');
  search();
}

// ── Show content drawer ──
function showContent(r) {
  let parsed = r.content;
  if (typeof r.content === 'string') { try { parsed = JSON.parse(r.content); } catch(e) {} }

  document.getElementById('content-type').textContent = r.operateType;
  document.getElementById('d-time').textContent = new Date(r.createTime).toLocaleString('zh-CN');
  document.getElementById('d-operator').textContent = r.operator || '-';
  document.getElementById('d-bizid').textContent = r.bizId || '-';
  document.getElementById('content-json').textContent = typeof parsed === 'string' ? parsed : JSON.stringify(parsed, null, 2);
  document.getElementById('content-json').dataset.raw = typeof parsed === 'string' ? parsed : JSON.stringify(parsed, null, 2);

  document.body.classList.add('drawer-open');
  document.getElementById('content-overlay').classList.add('open');
  document.getElementById('content-drawer').classList.add('open');
}
function closeContentDrawer() {
  document.body.classList.remove('drawer-open');
  document.getElementById('content-overlay').classList.remove('open');
  document.getElementById('content-drawer').classList.remove('open');
}

function copyContent() {
  const txt = document.getElementById('content-json').dataset.raw || '';
  navigator.clipboard.writeText(txt).then(() => {
    showToast('success', '已复制 JSON');
  });
}

// ── Export CSV ──
function exportCSV() {
  if (!currentRows.length) { showToast('error', '当前页无数据可导出'); return; }
  const headers = ['ID', '时间', '业务类型', '操作类型', '业务ID', '操作人', '内容'];
  const rows = currentRows.map(r => [
    r.id,
    new Date(r.createTime).toISOString(),
    r.bizType,
    r.operateType,
    r.bizId || '',
    r.operator || '',
    typeof r.content === 'string' ? r.content : JSON.stringify(r.content || {})
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `operate-logs-${new Date().toISOString().substring(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('success', '已导出 CSV');
}

// ── Badge helpers (compatible with common.js) ──
function badgeOpType(t) {
  const map = {
    CREATE: 'badge-green', UPDATE: 'badge-blue', DELETE: 'badge-red',
    REGENERATE: 'badge-purple', ROLLBACK: 'badge-yellow',
  };
  return `<span class="badge ${map[t]||'badge-gray'}">${t}</span>`;
}
function badgeBizType(t) {
  const map = { APIKEY: 'badge-blue', THREADPOOL_CONFIG: 'badge-purple' };
  return `<span class="badge ${map[t]||'badge-gray'}">${t}</span>`;
}

function showToast(type, msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast--${type}`;
  t.innerHTML = `<span>${msg}</span><span class="toast__close" onclick="this.parentElement.remove()">&times;</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.animation='toast-out .2s ease forwards'; setTimeout(()=>t.remove(),200); }, 3000);
}
</script>

</body>
</html>
