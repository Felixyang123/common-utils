<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - ThreadPool Admin</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="/js/common.js"></script>
</head>
<body class="login-wrap">
  <div class="login-box">
    <h1>ThreadPool Admin</h1>
    <p>线程池管理后台</p>
    <div id="error" class="error" style="display:none"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" class="form-control" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登 录</button>
  </div>
  <script>
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    async function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      if (!u || !p) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.code === 0 && data.data) {
          setToken(data.data.token);
          localStorage.setItem('username', data.data.username);
          location.href = '/index.html';
        } else {
          errEl.textContent = data.msg || '登录失败';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.textContent = '网络错误，请重试';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
