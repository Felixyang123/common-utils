<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - ThreadPool Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="/js/common.js"></script>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <div class="login-card__brand">
      <div class="login-card__logo">T</div>
      <div class="login-card__title">ThreadPool Admin</div>
      <div class="login-card__subtitle">线程池管理控制台</div>
    </div>

    <!-- Error message -->
    <div id="error" class="login-error"></div>

    <!-- Form -->
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" class="form-control" placeholder="请输入用户名"
               autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" class="form-control" placeholder="请输入密码"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">
        登 录
      </button>
    </form>

    <div class="login-footer">
      ThreadPool Admin v2.0 &copy; 2026
    </div>

  </div>
</div>

<script>
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin(new Event('submit'));
  });

  async function doLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const errEl = document.getElementById('error');

    if (!u || !p) { showError('请输入用户名和密码'); return; }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.code === 0 && data.data) {
        setToken(data.data.token);
        localStorage.setItem('username', data.data.username);
        location.href = '/index.html';
      } else {
        showError(data.msg || '登录失败，请检查用户名和密码');
      }
    } catch (e) {
      showError('网络错误，请稍后重试');
    }
  }

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.classList.add('show');
  }
</script>

</body>
</html>
