<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监控统计 - ThreadPool Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/drawer.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Page-specific styles */
    .stat-metric {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      transition: all var(--duration-normal) ease;
    }
    .stat-metric:hover { border-color: var(--color-border-strong); box-shadow: var(--shadow-sm); }
    .stat-metric__label {
      font-size: var(--font-size-xs);
      color: var(--color-text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-metric__value {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--color-text);
    }
    .stat-metric__hint {
      font-size: var(--font-size-xs);
      color: var(--color-text-3);
      margin-top: var(--space-1);
    }
    .stat-metric--alert {
      border-color: rgba(220, 38, 38, 0.3);
      background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-danger-subtle) 100%);
    }
    .stat-metric--alert .stat-metric__value { color: var(--color-danger); }

    .chart-container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      position: relative;
      min-height: 360px;
    }
    .chart-container canvas { max-height: 320px; }

    .time-tabs {
      display: inline-flex;
      background: var(--color-surface-2);
      border-radius: var(--radius-sm);
      padding: 3px;
    }
    .time-tab {
      padding: 4px 12px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-2);
      border-radius: 4px;
      cursor: pointer;
      transition: all var(--duration-fast) ease;
    }
    .time-tab:hover { color: var(--color-text); }
    .time-tab.active {
      background: var(--color-surface);
      color: var(--color-accent);
      box-shadow: var(--shadow-xs);
    }
  </style>
</head>
<body>

<script src="/js/common.js"></script>
<script>
  if (!requireAuth()) throw new Error('redirect');
</script>

<nav class="topbar" id="topbar"></nav>

<div class="page">

  <div class="breadcrumb">threadpool / 监控统计</div>
  <div class="page-header">
    <div>
      <h1>监控统计</h1>
      <p class="text-sm text-muted mt-2">查看线程池运行时实时指标、历史趋势与异常</p>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="card mb-4" style="padding:0;">
    <div class="filter-bar">
      <div>
        <label>应用</label>
        <select class="form-control" id="s-app" style="min-width:160px;" onchange="onAppChange()">
          <option value="">-- 选择应用 --</option>
        </select>
      </div>
      <div>
        <label>线程池</label>
        <select class="form-control" id="s-pool" style="min-width:160px;" onchange="loadStats()">
          <option value="">-- 选择池 --</option>
        </select>
      </div>
      <div style="margin-left:auto;display:flex;align-items:flex-end;gap:12px;">
        <div class="time-tabs">
          <span class="time-tab" data-window="5m" onclick="setWindow(this)">5m</span>
          <span class="time-tab active" data-window="1h" onclick="setWindow(this)">1h</span>
          <span class="time-tab" data-window="6h" onclick="setWindow(this)">6h</span>
          <span class="time-tab" data-window="24h" onclick="setWindow(this)">24h</span>
          <span class="time-tab" data-window="7d" onclick="setWindow(this)">7d</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="refreshNow()">↻ 刷新</button>
      </div>
    </div>
  </div>

  <!-- Top Metric Cards -->
  <div class="grid-4" id="metric-cards" style="margin-bottom:var(--space-4);">
    <div class="stat-metric">
      <div class="stat-metric__label">活跃线程</div>
      <div class="stat-metric__value" id="m-active">--</div>
      <div class="stat-metric__hint" id="m-active-hint">/ --</div>
    </div>
    <div class="stat-metric">
      <div class="stat-metric__label">队列使用</div>
      <div class="stat-metric__value" id="m-queue">--</div>
      <div class="stat-metric__hint" id="m-queue-hint">/ --</div>
    </div>
    <div class="stat-metric" id="m-reject-card">
      <div class="stat-metric__label">被拒绝任务</div>
      <div class="stat-metric__value" id="m-reject">--</div>
      <div class="stat-metric__hint" id="m-reject-hint">拒绝率 --</div>
    </div>
    <div class="stat-metric">
      <div class="stat-metric__label">已完成任务</div>
      <div class="stat-metric__value" id="m-completed">--</div>
      <div class="stat-metric__hint" id="m-completed-hint">错误数 --</div>
    </div>
  </div>

  <!-- Chart Card -->
  <div class="chart-container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-size:14px;font-weight:600;">趋势图</h3>
      <div class="text-xs text-muted">每 10 秒采集一次</div>
    </div>
    <canvas id="chart"></canvas>
    <div id="chart-empty" class="empty-state" style="display:none;padding:60px 0;">
      <div class="empty-state__icon">📊</div>
      <div class="empty-state__title">暂无统计数据</div>
      <div class="empty-state__desc">该线程池在选定时间窗口内没有上报记录</div>
    </div>
  </div>

  <!-- Alert History -->
  <div class="card" style="margin-top:var(--space-4);">
    <div class="card-header">
      <h3>近期告警事件</h3>
      <span class="text-xs text-muted">触发条件：拒绝率 &gt; 5% 或 队列使用 &gt; 80%</span>
    </div>
    <div style="padding: var(--space-3) var(--space-4);" id="alert-events">
      <div class="text-sm text-muted text-center" style="padding:20px;">加载中...</div>
    </div>
  </div>

</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
renderTopbar('stats.html');

let chart = null;
let currentWindow = '1h';

// ── Load apps into dropdown ──
(async () => {
  const res = await apiGet('/api/thread-pool/configs');
  if (!res || res.code !== 0) return;
  const apps = res.data || [];
  const sel = document.getElementById('s-app');
  sel.innerHTML = '<option value="">-- 选择应用 --</option>' +
    apps.map(a => `<option value="${a.appId}">${a.appId} (${a.poolCount} 池)</option>`).join('');
  if (apps.length) {
    sel.value = apps[0].appId;
    onAppChange();
  }
})();

async function onAppChange() {
  const appId = document.getElementById('s-app').value;
  if (!appId) return;
  const res = await apiGet('/api/thread-pool/configs/' + encodeURIComponent(appId));
  const pools = ((res && res.code===0) ? res.data : {}).configs || [];
  const sel = document.getElementById('s-pool');
  sel.innerHTML = '<option value="">-- 选择池 --</option>' +
    pools.map(p => `<option value="${p.poolName}">${p.poolName}</option>`).join('');
  if (pools.length) { sel.value = pools[0].poolName; loadStats(); }
}

function setWindow(el) {
  document.querySelectorAll('.time-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentWindow = el.dataset.window;
  loadStats();
}

async function loadStats() {
  const appId = document.getElementById('s-app').value;
  const pool = document.getElementById('s-pool').value;
  if (!appId || !pool) return;

  // Compute time range from window
  const ranges = { '5m': 5*60, '1h': 3600, '6h': 6*3600, '24h': 24*3600, '7d': 7*24*3600 };
  const end = new Date();
  const begin = new Date(end.getTime() - (ranges[currentWindow]||3600)*1000);

  const url = `/api/stats/${encodeURIComponent(appId)}/${encodeURIComponent(pool)}?begin=${begin.toISOString()}&end=${end.toISOString()}`;
  const res = await apiGet(url);
  if (!res || res.code !== 0) return;
  const stats = res.data || [];

  renderMetrics(stats);
  renderChart(stats);
  renderAlertEvents(stats);
}

function renderMetrics(stats) {
  if (!stats.length) {
    document.getElementById('m-active').textContent = '--';
    return;
  }
  const latest = stats[stats.length-1];
  document.getElementById('m-active').textContent = latest.activeCount;
  document.getElementById('m-active-hint').textContent = `线程池 ${latest.poolSize} / ${latest.maximumPoolSize}`;

  const qPct = latest.queueCapacity ? Math.round(latest.queueSize / latest.queueCapacity * 100) : 0;
  document.getElementById('m-queue').textContent = latest.queueSize;
  document.getElementById('m-queue-hint').textContent = `/${latest.queueCapacity} · ${qPct}%`;

  document.getElementById('m-reject').textContent = latest.rejectedTaskCount;
  const totalSubmitted = latest.submittedTaskCount || 0;
  const rejectRate = totalSubmitted > 0 ? (latest.rejectedTaskCount / totalSubmitted * 100).toFixed(2) : '0';
  document.getElementById('m-reject-hint').textContent = `拒绝率 ${rejectRate}%`;

  // Alert highlight
  const rejectCard = document.getElementById('m-reject-card');
  rejectCard.classList.toggle('stat-metric--alert', parseFloat(rejectRate) > 5);

  document.getElementById('m-completed').textContent = (latest.completedTaskCount||0).toLocaleString();
  document.getElementById('m-completed-hint').textContent = `错误数 ${latest.errorTaskCount||0}`;
}

function renderChart(stats) {
  if (chart) { chart.destroy(); chart = null; }
  const empty = document.getElementById('chart-empty');
  if (!stats.length) {
    document.querySelector('.chart-container canvas').style.display = 'none';
    empty.style.display = '';
    return;
  }
  document.querySelector('.chart-container canvas').style.display = '';
  empty.style.display = 'none';

  const labels = stats.map(s => {
    const d = new Date(s.collectTime);
    return currentWindow === '7d' || currentWindow === '24h'
      ? d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  });

  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '活跃线程', data: stats.map(s => s.activeCount), borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.08)', tension: 0.3, fill: true, pointRadius: 0, borderWidth: 2 },
        { label: '队列大小', data: stats.map(s => s.queueSize), borderColor: '#d97706', tension: 0.3, fill: false, pointRadius: 0, borderWidth: 2 },
        { label: '池大小', data: stats.map(s => s.poolSize), borderColor: '#16a34a', tension: 0.3, fill: false, pointRadius: 0, borderWidth: 2 },
        { label: '拒绝', data: stats.map(s => s.rejectedTaskCount), borderColor: '#dc2626', tension: 0.3, fill: false, pointRadius: 0, borderWidth: 2, yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 12 } } },
        tooltip: { backgroundColor: 'rgba(24,24,27,0.95)', padding: 10, cornerRadius: 6 },
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 } } },
        y1: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { font: { size: 11 } } },
      }
    }
  });
}

function renderAlertEvents(stats) {
  const el = document.getElementById('alert-events');
  if (!stats.length) {
    el.innerHTML = '<div class="text-sm text-muted text-center" style="padding:20px;">暂无告警事件</div>';
    return;
  }
  // Find points exceeding thresholds
  const events = [];
  for (let i = 0; i < stats.length; i++) {
    const s = stats[i];
    const rate = s.submittedTaskCount > 0 ? s.rejectedTaskCount / s.submittedTaskCount : 0;
    const qPct = s.queueCapacity ? s.queueSize / s.queueCapacity : 0;
    if (rate > 0.05) events.push({ time: s.collectTime, type: '拒绝率', value: (rate*100).toFixed(1)+'%' });
    else if (qPct > 0.8) events.push({ time: s.collectTime, type: '队列使用率', value: (qPct*100).toFixed(0)+'%' });
  }
  if (!events.length) {
    el.innerHTML = '<div class="text-sm text-muted text-center" style="padding:20px;">选定时间窗口内未触发告警 🎉</div>';
    return;
  }
  el.innerHTML = events.slice(0, 10).map(e => `
    <div class="alert-row">
      <div class="alert-row__icon">⚠</div>
      <div class="alert-row__body">
        <div class="alert-row__title">${e.type}超阈值 <span class="badge badge-red" style="margin-left:4px;">${e.value}</span></div>
        <div class="alert-row__meta">${new Date(e.time).toLocaleString('zh-CN')}</div>
      </div>
    </div>
  `).join('');
}

function refreshNow() {
  loadStats();
  showToast('info', '已刷新');
}

function showToast(type, msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast--${type}`;
  t.innerHTML = `<span>${msg}</span><span class="toast__close" onclick="this.parentElement.remove()">&times;</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.animation='toast-out .2s ease forwards'; setTimeout(()=>t.remove(),200); }, 3000);
}
</script>

</body>
</html>
