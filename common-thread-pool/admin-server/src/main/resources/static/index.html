<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - ThreadPool Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/drawer.css">
</head>
<body>

<script src="/js/common.js"></script>
<script>
  if (!requireAuth()) throw new Error('redirect');
</script>

<!-- ═══════ TOPBAR ═══════ -->
<nav class="topbar" id="topbar"></nav>

<!-- ═══════ PAGE ═══════ -->
<div class="page">

  <!-- ═══ Header with greeting + search ═══ -->
  <div class="breadcrumb">threadpool / 仪表盘</div>
  <div class="page-header">
    <div>
      <h1 id="greeting">仪表盘</h1>
      <p class="text-sm text-muted mt-2" id="summary-line">加载中...</p>
    </div>
    <div style="position:relative;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-3);pointer-events:none;">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" class="form-control" placeholder="⌘K 搜索应用、池、Key..."
             style="width:260px;padding-left:36px;font-size:12px;">
    </div>
  </div>

  <!-- ═══ App Switcher ═══ -->
  <div id="app-switcher-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5);flex-wrap:wrap;gap:12px;">
    <div class="app-switcher" id="app-switcher" onclick="toggleAppDropdown()">
      <span class="app-switcher__dot"></span>
      <span class="app-switcher__name" id="switcher-name">全部应用</span>
      <span class="app-switcher__ver" id="switcher-ver" style="display:none;"></span>
      <span class="app-switcher__arrow">▾</span>
      <div class="app-switcher__dropdown" id="app-dropdown"></div>
    </div>
    <div class="sync-indicator" title="配置同步状态">
      <span class="sync-indicator__dot"></span> 实时同步
    </div>
  </div>

  <!-- ═══ 4 Stat Cards ═══ -->
  <div class="grid-4" id="stat-cards-grid">
    <div class="stat-card">
      <div class="stat-card__label">应用数</div>
      <div class="stat-card__value" id="stat-apps">--</div>
      <div class="stat-card__trend stat-card__trend--flat" id="stat-apps-trend">已接入</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__label">线程池</div>
      <div class="stat-card__value" id="stat-pools">--</div>
      <div class="stat-card__trend stat-card__trend--flat" id="stat-pools-trend">配置项总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__label">API Keys</div>
      <div class="stat-card__value" id="stat-keys">--</div>
      <div class="stat-card__trend stat-card__trend--flat" id="stat-keys-trend">活跃凭证</div>
    </div>
    <div class="stat-card stat-card--alert">
      <div class="stat-card__label" style="display:flex;align-items:center;gap:6px;">
        <span class="pulse-dot"></span> 异常线程池
      </div>
      <div class="stat-card__value" id="stat-alerts">--</div>
      <div class="stat-card__trend" id="stat-alerts-trend" style="color:var(--color-danger);">告警功能 v2.0 接入中</div>
    </div>
  </div>

  <!-- ═══ Dual-column: Pool List + Alerts/Activity ═══ -->
  <div class="dashboard-grid" style="margin-top: var(--space-5);">

    <!-- LEFT: Pool Table -->
    <div class="card">
      <div class="card-header">
        <h3>线程池列表 <span class="text-muted font-normal" id="pool-count-badge" style="font-size:var(--font-size-sm);font-weight:400;"></span></h3>
        <button class="btn btn-primary btn-sm" onclick="location.href='thread-pools.html'">+ 新建池</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>池名</th>
              <th>核心/最大</th>
              <th>队列</th>
              <th>运行指标</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="pool-table-body">
            <tr><td colspan="5" class="empty-state" style="padding:40px;">
              <div class="empty-state__desc">加载中...</div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- RIGHT: Alerts + Activity -->
    <div style="display:flex;flex-direction:column;gap:var(--space-4);">

      <!-- Active Alerts -->
      <div class="card">
        <div class="card-header">
          <h3>活跃告警</h3>
          <span class="badge badge-red" id="alert-count-badge">0</span>
        </div>
        <div class="card-body" style="padding:var(--space-3) var(--space-4);" id="alerts-panel">
          <p class="text-sm text-muted text-center" style="padding:16px 0;">暂无告警</p>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="card">
        <div class="card-header">
          <h3>最近活动</h3>
          <span class="text-xs text-muted">● 实时</span>
        </div>
        <div style="max-height:280px;overflow-y:auto;" id="activity-list">
          <p class="text-sm text-muted text-center" style="padding:16px 0;">加载中...</p>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
renderTopbar('index.html');

// ── Greeting ──
(function() {
  const h = new Date().getHours();
  let prefix = '早上好';
  if (h >= 12 && h < 14) prefix = '中午好';
  else if (h >= 14 && h < 18) prefix = '下午好';
  else if (h >= 18 || h < 5) prefix = '晚上好';
  document.getElementById('greeting').textContent = prefix + '，' + (getNickname() || getUsername());
})();

// ── App Switcher state ──
let dropdownOpen = false;
let allApps = [];
let currentAppId = '';

function toggleAppDropdown() {
  dropdownOpen = !dropdownOpen;
  document.getElementById('app-dropdown').classList.toggle('open', dropdownOpen);
}
document.addEventListener('click', function(e) {
  var sw = document.getElementById('app-switcher');
  if (!sw.contains(e.target)) {
    dropdownOpen = false;
    document.getElementById('app-dropdown').classList.remove('open');
  }
});

function selectApp(appId) {
  if (appId) {
    localStorage.setItem('currentApp', appId);
    location.href = 'index.html?app=' + encodeURIComponent(appId);
  } else {
    localStorage.removeItem('currentApp');
    location.href = 'index.html';
  }
}

// ── Load data ──
(async function loadAll() {
  try {
    var current = new URLSearchParams(location.search).get('app') ||
                  localStorage.getItem('currentApp') || '';
    currentAppId = current;

    // Step 1: dashboard summary + app summaries in parallel
    var results = await Promise.all([
      apiGet('/api/dashboard/summary'),
      apiGet('/api/thread-pool/configs')
    ]);

    var summaryRes = results[0];
    var appsRes = results[1];

    // Stats cards
    if (summaryRes && summaryRes.code === 0) {
      var d = summaryRes.data || {};
      document.getElementById('stat-apps').textContent = d.appCount || 0;
      document.getElementById('stat-pools').textContent = d.configCount || 0;
      document.getElementById('stat-keys').textContent = d.apiKeyCount || 0;
      document.getElementById('pool-count-badge').textContent = '(' + (d.configCount || 0) + ')';

      var logs = d.recentLogs || [];
      if (logs.length) {
        var last = logs[0];
        document.getElementById('summary-line').textContent = (d.appCount||0) + ' 个应用 · ' + (d.configCount||0) + ' 个线程池 · ' + (d.apiKeyCount||0) + ' 个 API Key · 更新于 ' + fmtTime(last.createTime || last.gmtCreate);
      } else {
        document.getElementById('summary-line').textContent = (d.appCount||0) + ' 个应用 · ' + (d.configCount||0) + ' 个线程池 · ' + (d.apiKeyCount||0) + ' 个 API Key';
      }
      renderActivity((d.recentLogs || []).slice(0, 6));
    }

    // Step 2: App summaries (appId / poolCount / configVersion) — store, render later
    if (appsRes && appsRes.code === 0) {
      allApps = appsRes.data || [];
      // Use configVersion from AppConfigSummary (no need to re-fetch)
      allApps.forEach(function(a) {
        if (a._version === undefined) a._version = a.configVersion || 0;
      });
    }

    // Step 3: Fetch pool configs for each app (parallelized)
    var appsToLoad = allApps;
    if (currentAppId) {
      appsToLoad = allApps.filter(function(a) { return a.appId === currentAppId; });
    }

    var poolFetches = appsToLoad.map(function(a) {
      return apiGet('/api/thread-pool/configs/' + encodeURIComponent(a.appId))
        .then(function(res) {
          if (res && res.code === 0 && res.data) {
            return { appId: a.appId, configs: res.data.configs || [], version: res.data.configVersion };
          }
          return { appId: a.appId, configs: [], version: 0 };
        })
        .catch(function() {
          return { appId: a.appId, configs: [], version: 0 };
        });
    });

    var appConfigs = await Promise.all(poolFetches);

    // Merge config version into app summaries for App Switcher
    appConfigs.forEach(function(ac) {
      var app = allApps.find(function(a) { return a.appId === ac.appId; });
      if (app) app._version = ac.version;
    });

    // Now render App Switcher (with version info attached)
    renderAppSwitcher(allApps);

    // Flatten all pools for the table
    var allPools = [];
    appConfigs.forEach(function(ac) {
      ac.configs.forEach(function(p) {
        allPools.push({
          poolName: p.poolName,
          corePoolSize: p.corePoolSize,
          maximumPoolSize: p.maximumPoolSize,
          queueType: p.queueType,
          queueCapacity: p.queueCapacity,
          keepAliveTime: p.keepAliveTime,
          rejectPolicyType: p.rejectPolicyType,
          _appId: ac.appId
        });
      });
    });

    renderPoolTable(allPools);

  } catch(e) {
    console.error(e);
    document.getElementById('summary-line').textContent = '数据加载失败';
  }
})();

// ── App Switcher ──
function renderAppSwitcher(apps) {
  var dd = document.getElementById('app-dropdown');
  dd.innerHTML =
    '<div class="app-switcher__option ' + (!currentAppId?'active':'') + '" onclick="selectApp(\'\')">' +
    '<span class="app-switcher__dot" style="background:var(--color-accent)"></span> 全部应用' +
    '<span style="margin-left:auto;font-size:11px;color:var(--color-text-3);">' + (apps.length) + ' 个</span>' +
    '</div>' +
    apps.map(function(a) {
      return '<div class="app-switcher__option ' + (a.appId===currentAppId?'active':'') + '" onclick="selectApp(\'' + a.appId + '\')">' +
        '<span class="app-switcher__dot"></span> ' + a.appId +
        '<span style="margin-left:auto;font-size:11px;color:var(--color-text-3);">' +
          (a.poolCount||0) + ' 池 · v' + (a._version != null ? a._version : '?') +
        '</span>' +
        '</div>';
    }).join('');
  if (currentAppId) {
    document.getElementById('switcher-name').textContent = currentAppId;
    var found = apps.find(function(a) { return a.appId === currentAppId; });
    if (found) {
      document.getElementById('switcher-ver').style.display = '';
      document.getElementById('switcher-ver').textContent = 'v' + (found._version != null ? found._version : '?');
    }
  } else {
    document.getElementById('switcher-ver').style.display = 'none';
  }
}

// ── Pool table ──
function renderPoolTable(allPools) {
  var tbody = document.getElementById('pool-table-body');
  var count = allPools.length;
  document.getElementById('pool-count-badge').textContent = '(' + count + ')';

  if (!count) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="padding:40px;">' +
      '<div class="empty-state__title">暂无线程池</div>' +
      '<div class="empty-state__desc">在<a href="thread-pools.html">线程池配置</a>页面创建第一个线程池</div>' +
      '</td></tr>';
    return;
  }

  tbody.innerHTML = allPools.map(function(p) {
    var qType = p.queueType || 'LINKED';
    var qCap = p.queueCapacity || 1024;
    return '<tr style="cursor:pointer;" onclick="location.href=\'thread-pools.html?app=' +
           encodeURIComponent(p._appId) + '&pool=' + encodeURIComponent(p.poolName) + '\'">' +
      '<td><div class="font-medium">' + p.poolName + '</div>' +
          '<div class="text-xs text-muted">' + p._appId + '</div></td>' +
      '<td><code>' + (p.corePoolSize||'-') + '/' + (p.maximumPoolSize||'-') + '</code></td>' +
      '<td><div class="text-xs text-muted">' + qType + ' / ' + qCap + '</div></td>' +
      '<td><span class="text-muted">v2.0</span></td>' +
      '<td><span class="badge badge-green">就绪</span></td>' +
    '</tr>';
  }).join('');
}

// ── Sparkline (pure CSS, 7 segments, height 28px) ──
function renderSparkline(pct) {
  // 7 evenly spaced values from low to high, last one anchored at pct
  var segments = [5, 22, 38, 55, 70, 85, pct];
  return '<span class="sparkline" title="' + pct + '%">' +
    segments.map(function(v, i) {
      var cls = '';
      if (pct >= v) {
        if (v > 80) cls = ' sparkline__bar--danger';
        else if (v > 50) cls = ' sparkline__bar--warn';
      }
      // Randomize bar height slightly for visual realism
      var h = pct >= v ? (14 + Math.random() * 14) : 4;
      return '<span class="sparkline__bar' + cls + '" style="height:' + h + 'px;"></span>';
    }).join('') +
    '</span>';
}

// ── Alert rows ──
function renderAlerts(pools) {
  var panel = document.getElementById('alerts-panel');
  var count = 0;
  var html = '';
  pools.forEach(function(p) {
    var qPct = p.queueCapacity ? Math.round((p.queueSize||0)/p.queueCapacity*100) : 0;
    var rRate = p.submittedTaskCount > 0 ? (p.rejectedTaskCount / p.submittedTaskCount * 100) : 0;
    if (qPct <= 80 && rRate <= 5) return;
    count++;
    var reason = rRate > 5 ? '拒绝率 ' + rRate.toFixed(1) + '%' : '队列使用率 ' + qPct + '%';
    html += '<div class="alert-row">' +
      '<div class="alert-row__icon">⚠</div>' +
      '<div class="alert-row__body">' +
        '<div class="alert-row__title">' + p.poolName +
          ' <span class="badge badge-red" style="margin-left:4px;">' + reason + '</span></div>' +
        '<div class="alert-row__meta">' + p._appId + '</div>' +
      '</div></div>';
  });
  document.getElementById('alert-count-badge').textContent = count;
  document.getElementById('alert-count-badge').style.display = count > 0 ? '' : 'none';
  panel.innerHTML = count ? html : '<p class="text-sm text-muted text-center" style="padding:16px 0;">暂无告警</p>';
}

// ── Activity stream ──
function renderActivity(logs) {
  var el = document.getElementById('activity-list');
  if (!logs.length) {
    el.innerHTML = '<p class="text-sm text-muted text-center" style="padding:16px 0;">暂无活动记录</p>';
    return;
  }
  var typeClass = { CREATE:'create', UPDATE:'update', DELETE:'delete', REGENERATE:'update', ROLLBACK:'update' };
  el.innerHTML = logs.map(function(r) {
    var cls = typeClass[r.operateType] || 'update';
    return '<div class="activity-item">' +
      '<span class="activity-item__type activity-item__type--' + cls + '">' + (r.operateType||'OP') + '</span>' +
      '<span class="activity-item__text">' + (r.bizId || '-') + '</span>' +
      '<span class="activity-item__time">' + relativeTime(r.createTime||r.gmtCreate) + '</span>' +
    '</div>';
  }).join('');
}

function relativeTime(ts) {
  if (!ts) return '';
  var diff = Date.now() - new Date(ts).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  return Math.floor(hours/24) + '天前';
}

// ── Time formatter ──
function fmtTime(ts) {
  if (!ts) return '-';
  return String(ts).replace('T', ' ').substring(0, 19);
}
</script>

</body>
</html>
