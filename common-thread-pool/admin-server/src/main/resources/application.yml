server:
  port: 8080

spring:
  application:
    name: thread-pool-admin-server
  profiles:
    active: db          # 默认 local 模式（H2 文件 + 进程内缓存）；切换生产用 --spring.profiles.active=db

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 日志（开发用）
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 打印 SQL 日志（生产用）
  global-config:
    db-config:
      id-type: auto  # 主键自增策略
      logic-delete-field: deleted  # 全局逻辑删除字段名
      logic-not-delete-value: 0    # 未删除值
      logic-delete-value: 1        # 已删除值

threadpool:
  admin:
    auth:
      enabled: true
      username: admin
      password: changeme
      secret: threadpool-admin-jwt-default-secret-please-change-in-production
      token-expire-minutes: 480        # 闲置超时 8 小时
      renew-threshold-minutes: 30      # 剩余 < 30 分钟时滑动续期
    apikey:
      # API Key HMAC-SHA256 服务端密钥（ADR-0007）。db profile 下不得为默认值（启动校验见 AdminServerAutoConfiguration）。
      hmac-secret: threadpool-admin-apikey-hmac-default-secret-please-change
  cache:
    default-config:
      ttl: 10m
      max-size: 5000
    configs:
      config-storage:
        ttl: 30m
        max-size: 10000
      api-key-storage:
        ttl: 60m
        max-size: 500
    null-value-ttl: 1m