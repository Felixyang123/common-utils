# db profile：生产 / 集群部署模式，连接 MySQL + Redis（可选 Redisson 分布式缓存与锁）。
#
# 启动：java -jar admin-server.jar --spring.profiles.active=db
# 数据源可通过环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD
# schema.sql 不会自动执行（生产建表由部署流程人工或迁移工具管理）。

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/threadpool_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:lifan1994}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  sql:
    init:
      mode: never              # 生产模式不自动执行 schema.sql

threadpool:
  admin:
    rate-limit:
      enabled: true            # 启用 Open API 限流（依赖 RedissonClient）