spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

threadpool:
  admin:
    rate-limit:
      enabled: false
    storage:
      type: local
    api-key-storage-path: ${java.io.tmpdir}/threadpool-test/api-keys
    config-storage-path: ${java.io.tmpdir}/threadpool-test/configs
    stats-storage-path: ${java.io.tmpdir}/threadpool-test/stats
    auth-enabled: true
    history-max-size: 50
    auth:
      enabled: false
