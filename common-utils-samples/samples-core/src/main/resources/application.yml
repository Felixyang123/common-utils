spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: common-utils
  datasource:
    url: jdbc:mysql://localhost:3306/task?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: lifan1994
  redis:
    host: localhost
    port: 6379

logging:
  level:
    root: info
